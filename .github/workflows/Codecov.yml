name: Code Coverage

on:
  workflow_call:
    inputs:
      tools:
        type: string
        required: false
        default: "composer:v2, phpunit"
      suites:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: true

jobs:
  prepare:
    name: Prepare PHP Configuration
    runs-on: ubuntu-latest
    outputs:
      phpVersion: ${{ steps.configuration.outputs.version }}
      phpExtensions: ${{ steps.configuration.outputs.extensions }}
    steps:

      # -------------------------
      # CHECKOUT & INSTALL
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read PHP Configuration
        id: configuration
        shell: bash
        run: |
          version=$(jq -er '
            .extra.firehub.ci["php-versions"]
            | select(
                type == "array"
                and length > 0
                and all(.[]; type == "string" and test("^[0-9]+\\.[0-9]+$"))
              )
            | sort_by(split(".") | map(tonumber))
            | last
          ' composer.json) || {
            echo "::error::Invalid or missing PHP versions in composer.json"
            exit 1
          }

          extensions=$(jq -r '
            (.require // {})
            | keys
            | map(select(startswith("ext-")))
            | map(ltrimstr("ext-"))
            | join(", ")
          ' composer.json) || {
            echo "::error::Unable to read PHP extensions from composer.json"
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "extensions=$extensions" >> "$GITHUB_OUTPUT"

  run:
    name: Code Coverage (${{ matrix.suite }}) - PHP ${{ needs.prepare.outputs.phpVersion }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    steps:

      # -------------------------
      # CHECKOUT & INSTALL
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.prepare.outputs.phpVersion }}
          extensions: ${{ needs.prepare.outputs.phpExtensions }}
          tools: ${{ inputs.tools }}
          coverage: xdebug
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate Platform Requirements
        run: composer check-platform-reqs

      # -------------------------
      # RUN TESTS PER SUITE
      # -------------------------
      - name: Run PHPUnit (${{ matrix.suite }})
        run: |
          phpunit \
            --testsuite ${{ matrix.suite }} \
            --coverage-clover=coverage-${{ matrix.suite }}.xml \
            --log-junit junit-${{ matrix.suite }}.xml

      # -------------------------
      # UPLOAD TO CODECOV
      # -------------------------
      - name: Upload Unit Coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-${{ matrix.suite }}.xml
          flags: ${{ matrix.suite }}
          name: ${{ matrix.suite }}-tests
          token: ${{ secrets.CODECOV_TOKEN }}